services:
  db:
    image: postgres:16-alpine
    container_name: webster-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webster}
      POSTGRES_USER: ${POSTGRES_USER:-webster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webster}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webster} -d ${POSTGRES_DB:-webster}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      target: production
    container_name: webster-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      JWT_SECRET: ${JWT_SECRET:-change-me-for-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_BASE_URL: ${CLIENT_BASE_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-webster}
      POSTGRES_USER: ${POSTGRES_USER:-webster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webster}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      - "${SERVER_PORT:-3000}:3000"

  client:
    build:
      context: ./client
      target: production
    container_name: webster-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-8080}:80"

volumes:
  postgres_data:
