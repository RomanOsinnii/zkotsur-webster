name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [client, server]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ matrix.app }}
        run: npm test

  deploy:
    runs-on: [self-hosted, webster-prod]
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: MAIN_ENV
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_ACTOR_NAME: ${{ github.actor }}
      GITHUB_SHA_FULL: ${{ github.sha }}
      GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
      GITHUB_REPOSITORY_NAME: ${{ github.repository }}
      GITHUB_SERVER_URL_VALUE: ${{ github.server_url }}
      GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
      GITHUB_RUN_NUMBER_VALUE: ${{ github.run_number }}
      GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual workflow dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy on VPS runner
        run: |
          chmod +x deploy.sh
          ./deploy.sh
